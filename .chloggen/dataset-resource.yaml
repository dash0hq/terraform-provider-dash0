change_type: new_component
component: datasets
note: "Add the `dash0_dataset` resource to manage Dash0 datasets: retention, privacy, redaction, and semantic convention upgrades."
issues: [171]
subtext: "Destroying a dataset soft-deletes it. Dashboards, views, check rules, synthetic checks, recording rules, SLOs and time series aggregations are kept for 30 days; applying the same slug within that time restores them. Spam filters are not restored. Telemetry is removed as its retention expires."
