name: Roundtrip Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels that pull request's run that is still
# going, so two pushes in quick succession don't run the suite twice at once.
# Runs on main are never cancelled.
concurrency:
  group: roundtrip-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every run shares one dataset, organization and AWS integration, so the
    # suite runs one at a time across all branches. GitHub keeps at most one
    # job waiting per group: when a third run queues, the waiting one is
    # cancelled and needs a re-run.
    concurrency:
      group: roundtrip-shared-dash0-account
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build test image and run roundtrip tests
        run: ./test/roundtrip/run_all.sh
        env:
          # The roundtrip credential has the organization-admin role the time
          # series aggregation endpoints require, so no test should skip. Fail
          # the run if one does, rather than reporting a green summary for a
          # test that never executed. Fork PRs are unaffected: run_all.sh exits
          # 0 before the skip logic when no credentials are available at all.
          ROUNDTRIP_REQUIRE_NO_SKIPS: 1
          DASH0_API_URL: ${{ secrets.DASH0_API_URL }}
          DASH0_AUTH_TOKEN: ${{ secrets.DASH0_AUTH_TOKEN }}
          DASH0_DATASET: ${{ secrets.DASH0_DATASET }}
          DASH0_OTLP_URL: ${{ secrets.DASH0_OTLP_URL }}
          # An AWS integration whose scrape config the scrape config tests may
          # replace and clear; they restore its config when they finish.
          DASH0_AWS_INTEGRATION_ID: ${{ secrets.DASH0_AWS_INTEGRATION_ID }}
