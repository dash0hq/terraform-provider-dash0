name: Roundtrip Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  roundtrip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build test image and run roundtrip tests
        run: ./test/roundtrip/run_all.sh
        env:
          # The roundtrip credential has the organization-admin role the time
          # series aggregation endpoints require, so no test should skip. Fail
          # the run if one does, rather than reporting a green summary for a
          # test that never executed. Fork PRs are unaffected: run_all.sh exits
          # 0 before the skip logic when no credentials are available at all.
          ROUNDTRIP_REQUIRE_NO_SKIPS: 1
          DASH0_API_URL: ${{ secrets.DASH0_API_URL }}
          DASH0_AUTH_TOKEN: ${{ secrets.DASH0_AUTH_TOKEN }}
          DASH0_DATASET: ${{ secrets.DASH0_DATASET }}
          DASH0_OTLP_URL: ${{ secrets.DASH0_OTLP_URL }}
